<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
      <title> Joke Machine</title>
    </head> 
    <body>
     <div class="card">
        <h1>Joke Machine</h1>
        <button id="joke-btn" onclick="loadJoke()">Load a joke</button>
        <button id="save-btn" onclick="saveFavourite()" disabled>Save favourite</button>
        <div id="spinner"></div>
        <div id="joke-area"></div>
        <p id="status"></p>
     </div>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;   
            align-items: center;      
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #6a708c, #d8d2dd);
        }
        .card {
            width: 90%;
            max-width: 420px;
            padding: 30px 25px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        #save-btn {
    margin-left: 8px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #e67e9a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}

#save-btn:hover {
    background: #d4658a;
}

#save-btn:active {
    transform: scale(0.96);
}

#save-btn:disabled {
    background: #f0c2cf;
    cursor: not-allowed;
}

  h1 {
        margin: 0 0 20px;
        font-size: 24px;
        color: #333;
        }

        #joke-btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #667eea;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #joke-btn:hover {
            background: #5568d3;
        }

        #joke-btn:active {
            transform: scale(0.96);
        }

        #joke-btn:disabled {
            background: #b5bdf0;
            cursor: not-allowed;
        }
        #spinner {
            display: none;
            width: 40px;
            height: 40px;
            margin: 20px auto 0;    
            border: 5px solid #e5e5e5;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #joke-area {
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        #joke-area p {
            margin: 8px 0;
            font-size: 18px;
            color: #444;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #status {
            margin: 15px 0 0;
            min-height: 1em;
        }
    </style>
<script>
    let currentJoke = null;
    function showError(message) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.style.color = 'red';
    }

    function clearStatus() {
        const status = document.getElementById('status');
        status.textContent = '';
        status.style.color = '';
    }

    function showSpinner(show) {
        document.getElementById('spinner').style.display = show ? 'block' : 'none';
    }
    function saveFavourite() {
    if (!currentJoke) return;

    try {
        const favourites = JSON.parse(localStorage.getItem('favourites')) || [];

        const alreadySaved = favourites.some(j => j.id === currentJoke.id);
        if (alreadySaved) {
            showError('Already in favourites.');
            return;
        }

        favourites.push(currentJoke);
        localStorage.setItem('favourites', JSON.stringify(favourites));
        clearStatus();
        status.textContent = 'Saved!';
    } catch (err) {
        console.error(err);
        showError('Could not save the joke.');
    }
}

    async function loadJoke() {
        const area = document.getElementById('joke-area');
        const btn = document.getElementById('joke-btn');

        clearStatus();
        currentJoke = null;                                  
        document.getElementById('save-btn').disabled = true; 
        area.innerHTML = '';
        showSpinner(true);
        btn.disabled = true;

        try {
            const res = await fetch('https://official-joke-api.appspot.com/random_joke');

            if (!res.ok) {
                throw new Error('Server error: ' + res.status);
            }

            const data = await res.json();
            currentJoke = data;
document.getElementById('save-btn').disabled = false;
            area.innerHTML = `<p><strong>${data.setup}</strong></p>
                              <p>${data.punchline}</p>`;
        } catch (err) {
            console.error(err);
            showError('Something went wrong. Please try again.');
        } finally {
            showSpinner(false);
            btn.disabled = false;
        }
    }

</script>
</body>
</html>
