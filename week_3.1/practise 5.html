<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif; /* That is the part that requires semicolon */
      background-color: #f0fdf4;
    }

    h1 {
      color: #15803d; /* Instead of equal sign, we have to use colon */
      font-size: 2rem;
      text-align: center;/* There should be a colon after text-align property. Because sode should identify where the property ends and where the value starts. */
    }

    p {
      line-height: 1.7;
      color: #334155; /* In CSS, we don't have property called foreground, and we use color: to apply colour to texts */
    }

    /* This is a fixed comment. We dont use double slashes to start and end comments in css */
    .highlight {
      background-color: #dcfce7;
    }
  </style>
</head>
<body>
  <h1>Here is a fixed code, with comments on acual code</h1>
  <p>This paragraph has <span class="highlight">broken CSS</span> around it. I found 5 mistakes and corrected them, write comments next to each mistake.</p>
</body>
</html>
