<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  .card { /* Here I added white background, 2px border, 12px radius*/
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #0f766e;
    border-radius: 12px;
    box-sizing: border-box;
    position: relative;
    margin: 40px;
  }
  .badge { /* Absolute position and badge styles added here*/
    position: absolute;
    top: 10px;
    right: 10px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Sale</span>
    <p style="padding:16px">Card number: 1233 4322 543</p> <!-- Card content with padding added here -->
  </div>
</body>
</html>
